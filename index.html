                                        >
                                            <i class="fa-solid fa-upload mr-1.5"></i> Upload Foto Baru
                                        </button>
                                    </div>

                                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                                        {galeri.map((foto) => (
                                            <div key={foto.id} class="bg-white rounded-xl border border-brand-border overflow-hidden shadow-sm group">
                                                <div class="relative h-40 overflow-hidden bg-slate-100">
                                                    <img src={foto.url} alt={foto.judul} class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                                                    <button 
                                                        onClick={() => triggerConfirm('Hapus Foto', `Hapus foto "${foto.judul}"?`, () => {
                                                            setGaleri(galeri.filter(g => g.id !== foto.id));
                                                            showToast('Foto terhapus dari galeri.');
                                                        })}
                                                        class="absolute top-2 right-2 w-7 h-7 bg-rose-600 text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition shadow"
                                                    >
                                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                                    </button>
                                                </div>
                                                <div class="p-3 text-xs">
                                                    <span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-[10px] font-medium">{foto.kategori}</span>
                                                    <h4 class="font-bold text-slate-800 mt-1 truncate">{foto.judul}</h4>
                                                    <p class="text-[10px] text-slate-400 mt-0.5">{foto.tanggal}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* ------------------------------------------------------------- */}
                            {/* TAB 8: PROFIL CMS */}
                            {/* ------------------------------------------------------------- */}
                            {}
                            {currentTab === 'web_profil' && (
                                <div class="space-y-5">
                                    <div>
                                        <h2 class="text-xl font-bold text-slate-800">CMS Profil Sekolah</h2>
                                        <p class="text-xs text-slate-500">Sunting Sejarah, Visi, Misi, dan Sambutan Kepala Sekolah.</p>
                                    </div>

                                    <div class="bg-white p-6 rounded-xl border border-brand-border shadow-sm space-y-5 text-xs">
                                        <div>
                                            <label class="block font-bold text-slate-700 mb-1">Sambutan Kepala Sekolah</label>
                                            <textarea rows="4" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg" defaultValue="Assalamu'alaikum Warahmatullahi Wabarakatuh. Selamat datang di website resmi SMA IT Granada Samarinda. Kami berkomitmen mencetak generasi Rabbani yang berprestasi dan beradab..."></textarea>
                                        </div>

                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label class="block font-bold text-slate-700 mb-1">Visi Sekolah</label>
                                                <textarea rows="3" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg" defaultValue="Menjadi Sekolah Islam Terpadu Unggulan yang Membentuk Generasi Qur'ani, Berprestasi Akademik Tinggi, dan Berwawasan Global di Kalimantan Timur."></textarea>
                                            </div>
                                            <div>
                                                <label class="block font-bold text-slate-700 mb-1">Misi Utama</label>
                                                <textarea rows="3" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg" defaultValue="1. Menyelenggarakan pendidikan holistik berbasis Al-Qur'an dan As-Sunnah. 2. Mengembangkan potensi kepemimpinan dan minat bakat sains teknologi siswa."></textarea>
                                            </div>
                                        </div>

                                        <div class="pt-3 border-t flex justify-end">
                                            <button onClick={() => showToast('Konten Profil Sekolah berhasil diperbarui!')} class="px-4 py-2 font-bold text-brand-dark bg-brand-gold hover:bg-brand-goldDark rounded-lg shadow transition">
                                                <i class="fa-solid fa-floppy-disk mr-1.5"></i> Simpan Perubahan Profil
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ------------------------------------------------------------- */}
                            {/* TAB 9: E-QUIZ SELEKSI */}
                            {/* ------------------------------------------------------------- */}
                            {}
                            {currentTab === 'equiz' && (
                                <div class="space-y-5">
                                    <div class="flex items-center justify-between">
                                        <div>
                                            <h2 class="text-xl font-bold text-slate-800">Pengelolaan E-Quiz Seleksi PSB</h2>
                                            <p class="text-xs text-slate-500">Kelola paket tes ujian potensi akademik dan pemetaan Bahasa online.</p>
                                        </div>
                                        <button onClick={() => setIsEquizModalOpen(true)} class="px-3.5 py-2 text-xs font-bold text-brand-dark bg-brand-gold hover:bg-brand-goldDark rounded-lg shadow transition">
                                            <i class="fa-solid fa-plus mr-1.5"></i> Buat Quiz Baru
                                        </button>
                                    </div>

                                    <div class="bg-white rounded-xl border border-brand-border shadow-sm overflow-hidden">
                                        <table class="w-full text-xs text-left text-slate-600">
                                            <thead class="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200 uppercase text-[10px]">
                                                <tr>
                                                    <th class="p-3">Nama Quiz / Ujian</th>
                                                    <th class="p-3">Kategori</th>
                                                    <th class="p-3">Jumlah Soal</th>
                                                    <th class="p-3">Total Peserta</th>
                                                    <th class="p-3">Status</th>
                                                    <th class="p-3 text-center">Aksi</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-100">
                                                {equiz.map((q) => (
                                                    <tr key={q.id} class="hover:bg-slate-50 transition">
                                                        <td class="p-3 font-bold text-slate-800">{q.nama}</td>
                                                        <td class="p-3"><span class="px-2 py-0.5 bg-slate-100 rounded text-slate-700">{q.kategori}</span></td>
                                                        <td class="p-3 font-semibold">{q.jumlahSoal} Soal</td>
                                                        <td class="p-3">{q.peserta} Orang</td>
                                                        <td class="p-3">{renderStatusBadge(q.status)}</td>
                                                        <td class="p-3 text-center">
                                                            <button 
                                                                onClick={() => setIsSoalModalOpen(true)}
                                                                class="px-2.5 py-1 text-xs bg-brand-primary text-white font-bold rounded hover:bg-brand-medium mr-1"
                                                            >
                                                                Kelola Soal
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* ------------------------------------------------------------- */}
                            {/* TAB 10: ALUMNI MANAGER */}
                            {/* ------------------------------------------------------------- */}
                            {}
                            {currentTab === 'alumni' && (
                                <div class="space-y-5">
                                    <div>
                                        <h2 class="text-xl font-bold text-slate-800">Tracer Study & Alumni</h2>
                                        <p class="text-xs text-slate-500">Kelola direktori kisah sukses para alumni SMA IT Granada.</p>
                                    </div>

                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {alumni.map((a) => (
                                            <div key={a.id} class="bg-white p-4 rounded-xl border border-brand-border flex items-start space-x-3 text-xs shadow-sm">
                                                <img src={a.foto} alt={a.nama} class="w-14 h-14 rounded-full object-cover border-2 border-brand-gold flex-shrink-0" />
                                                <div>
                                                    <h4 class="font-bold text-slate-800 text-sm">{a.nama}</h4>
                                                    <p class="text-slate-500 text-[11px]">Angkatan {a.lulus} | {a.profesi}</p>
                                                    <p class="italic text-slate-600 mt-2 bg-slate-50 p-2 rounded border border-slate-100">"{a.cerita}"</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* ------------------------------------------------------------- */}
                            {/* TAB 11: PENGATURAN SYSTEM */}
                            {/* ------------------------------------------------------------- */}
                            {}
                            {currentTab === 'settings' && (
                                <div class="space-y-5">
                                    <div>
                                        <h2 class="text-xl font-bold text-slate-800">Pengaturan Website & Sekolah</h2>
                                        <p class="text-xs text-slate-500">Konfigurasi alamat, kontak panitia PSB, dan integrasi WhatsApp.</p>
                                    </div>

                                    <div class="bg-white p-6 rounded-xl border border-brand-border shadow-sm space-y-4 text-xs">
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label class="block font-semibold text-slate-700 mb-1">Nama Sekolah</label>
                                                <input type="text" defaultValue="SMA IT Granada Samarinda" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg" />
                                            </div>
                                            <div>
                                                <label class="block font-semibold text-[11px] text-slate-700 mb-1">Email Resmi</label>
                                                <input type="text" defaultValue="info@smaitgranadasamarinda.sch.id" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg" />
                                            </div>
                                            <div>
                                                <label class="block font-semibold text-slate-700 mb-1">Nomor WhatsApp Panitia PSB</label>
                                                <input type="text" defaultValue="+62 812-5500-9988" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg" />
                                            </div>
                                            <div>
                                                <label class="block font-semibold text-slate-700 mb-1">Alamat Kampus</label>
                                                <input type="text" defaultValue="Jl. Suka Ramai No. 12, Sempaja Selatan, Samarinda Utara" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg" />
                                            </div>
                                        </div>

                                        <div class="pt-3 border-t flex justify-end">
                                            <button onClick={() => showToast('Pengaturan sistem berhasil disimpan.')} class="px-4 py-2 font-bold text-brand-dark bg-brand-gold hover:bg-brand-goldDark rounded-lg shadow transition">
                                                Simpan Pengaturan
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>

                    {/* ------------------------------------------------------------- */}
                    {/* MODAL: TAMBAH PENDAFTAR BARU */}
                    {/* ------------------------------------------------------------- */}
                    {}
                    {isAddModalOpen && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
                            <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-lg w-full p-6 space-y-4">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="font-bold text-slate-800 text-base">Tambah Data Pendaftar Manual</h3>
                                    <button onClick={() => setIsAddModalOpen(false)} class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                                </div>

                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const formData = new FormData(e.target);
                                    const newEntry = {
                                        id: `PSB-2026-00${pendaftar.length + 1}`,
                                        nama: formData.get('nama'),
                                        nisn: formData.get('nisn'),
                                        asalSekolah: formData.get('asalSekolah'),
                                        jalur: formData.get('jalur'),
                                        tanggal: new Date().toISOString().split('T')[0],
                                        status: 'Menunggu Verifikasi',
                                        whatsapp: formData.get('whatsapp'),
                                        email: formData.get('email'),
                                        ortu: formData.get('ortu'),
                                        berkas: { foto: true, kk: true, ijazah: false, prestasi: false, undangan: false },
                                        catatan: 'Pendaftaran manual via Admin'
                                    };
                                    setPendaftar([newEntry, ...pendaftar]);
                                    setIsAddModalOpen(false);
                                    showToast('Pendaftar baru berhasil ditambahkan!');
                                }} class="space-y-3 text-xs">
                                    <div>
                                        <label class="block font-medium text-slate-700 mb-1">Nama Lengkap Siswa</label>
                                        <input required name="nama" type="text" class="w-full p-2 bg-slate-50 border rounded-lg" placeholder="Ahmad Zaky" />
                                    </div>

                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block font-medium text-slate-700 mb-1">NISN</label>
                                            <input required name="nisn" type="text" class="w-full p-2 bg-slate-50 border rounded-lg" placeholder="008123456" />
                                        </div>
                                        <div>
                                            <label class="block font-medium text-slate-700 mb-1">Jalur PSB</label>
                                            <select name="jalur" class="w-full p-2 bg-slate-50 border rounded-lg">
                                                <option value="Reguler">Reguler</option>
                                                <option value="Prestasi">Prestasi</option>
                                                <option value="Undangan">Undangan</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block font-medium text-slate-700 mb-1">Asal Sekolah (SMP/MTs)</label>
                                        <input required name="asalSekolah" type="text" class="w-full p-2 bg-slate-50 border rounded-lg" placeholder="SMPN 1 Samarinda" />
                                    </div>

                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block font-medium text-slate-700 mb-1">No. WhatsApp</label>
                                            <input required name="whatsapp" type="text" class="w-full p-2 bg-slate-50 border rounded-lg" placeholder="08123456789" />
                                        </div>
                                        <div>
                                            <label class="block font-medium text-slate-700 mb-1">Nama Orang Tua</label>
                                            <input required name="ortu" type="text" class="w-full p-2 bg-slate-50 border rounded-lg" placeholder="Budi Santoso" />
                                        </div>
                                    </div>

                                    <div class="pt-3 flex justify-end space-x-2">
                                        <button type="button" onClick={() => setIsAddModalOpen(false)} class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg">Batal</button>
                                        <button type="submit" class="px-4 py-2 bg-brand-gold text-brand-dark font-bold rounded-lg shadow">Simpan Pendaftar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: KELOLA SOAL E-QUIZ */}
                    {isSoalModalOpen && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
                            <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-xl w-full p-6 space-y-4">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="font-bold text-slate-800 text-base">Kelola Soal - Tes Potensi Akademik</h3>
                                    <button onClick={() => setIsSoalModalOpen(false)} class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                                </div>

                                <div class="space-y-3 text-xs max-h-80 overflow-y-auto">
                                    <div class="p-3 border rounded-lg bg-slate-50">
                                        <p class="font-bold text-slate-800 mb-1">Soal #1: Berapakah hasil dari logaritma 100 berbasis 10?</p>
                                        <p class="text-emerald-700 font-semibold">Kunci Jawaban: B. 2</p>
                                    </div>
                                    <div class="p-3 border rounded-lg bg-slate-50">
                                        <p class="font-bold text-slate-800 mb-1">Soal #2: Antonim dari kata "Pragmatis" adalah...</p>
                                        <p class="text-emerald-700 font-semibold">Kunci Jawaban: C. Idealis</p>
                                    </div>
                                </div>

                                <div class="pt-2 flex justify-between items-center">
                                    <button onClick={() => showToast('Soal baru berhasil ditambahkan!')} class="px-3 py-1.5 bg-brand-primary text-white font-semibold rounded text-xs">
                                        <i class="fa-solid fa-plus mr-1"></i> Tambah Pertanyaan
                                    </button>
                                    <button onClick={() => setIsSoalModalOpen(false)} class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold">
                                        Selesai
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
